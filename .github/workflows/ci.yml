name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A newer push to the same pull request or branch cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p lectern-core --all-targets -- -D warnings
      - name: Test
        run: cargo test -p lectern-core
      - name: Render benchmark
        run: cargo run -p lectern-core --release --example render_bench
      # The tests above rewrite the ts-rs bindings; any change means the committed ones are stale.
      - name: TypeScript bindings are up to date
        run: |
          git status --porcelain -- ui/src/generated
          git diff --exit-code -- ui/src/generated
          test -z "$(git status --porcelain -- ui/src/generated)"

  ui:
    name: UI (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - name: Export the rendered fixtures
        run: cargo run -p lectern-core --example export_fixtures
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run e2e -- --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            ui/playwright-report/
            ui/test-results/
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        # Git Bash: PowerShell's npm.ps1 shim swallows the `--` before npm script arguments.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      # `tauri::generate_context!` embeds ui/dist, so lectern doesn't compile without it.
      - name: Build the UI
        working-directory: ui
        run: npm run build
      - name: Clippy
        run: cargo clippy -p lectern --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build lectern.exe
        working-directory: ui
        run: npm run tauri -- build --no-bundle

      # Opens the 3,000-line fixture plan and quits once it has painted. The bound is generous for
      # a shared runner; the real cold-start target is measured on a dev machine.
      - name: Smoke run
        shell: pwsh
        timeout-minutes: 5
        run: |
          $exe = (Resolve-Path target/release/lectern.exe).Path
          $doc = (Resolve-Path fixtures/vault/work/alpha/plans/2026-01-01-big-plan.md).Path
          $log = Join-Path $env:RUNNER_TEMP 'perf.jsonl'
          $p = Start-Process -FilePath $exe -PassThru `
            -ArgumentList "`"$doc`"", '--perf-log', "`"$log`"", '--exit-after-paint'
          try {
            if (-not $p.WaitForExit(60000)) { throw 'Lectern did not quit within 60 s of launch' }
          } finally {
            Stop-Process -Name lectern -Force -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path $log)) { throw 'Lectern wrote no perf log' }
          $marks = @(Get-Content $log | ForEach-Object { $_ | ConvertFrom-Json })
          $marks | Format-Table event, sinceStartMs, extraMs -AutoSize | Out-String | Write-Host
          $paint = $marks | Where-Object event -eq 'first-paint' | Select-Object -First 1
          if (-not $paint) { throw 'the perf log has no first-paint mark' }
          $ms = [math]::Round($paint.sinceStartMs, 1)
          Write-Host "first-paint: $ms ms"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 `
            -Value "Smoke run first-paint: **$ms ms** (bound 3000 ms)"
          if ($paint.sinceStartMs -ge 3000) { throw "first paint took $ms ms; the bound is 3000 ms" }

      - name: Upload lectern.exe
        uses: actions/upload-artifact@v7
        with:
          name: lectern-windows-x64
          path: target/release/lectern.exe
          if-no-files-found: error
