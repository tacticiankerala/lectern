name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A newer push to the same pull request or branch cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Test data must be invented. This fails on any tracked text file holding a real-looking user
  # profile path: X:\Users\<name>, /home/<name> (also \home\<name>, as under \\wsl.localhost) or
  # /Users/<name>, with single or doubled separators, unless the whole <name> is an invented
  # stand-in or a file name. It prints only file:line, so a leak isn't repeated in the public log.
  privacy:
    name: Privacy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: No real user-profile paths
        run: |
          # c is one character of a <name>: anything but whitespace, a separator, a quote, a
          # bracket, a placeholder sign ($ %) or punctuation no user name holds.
          c='[^\s\\/"\x27\x60()[\]{}<>|*?:,;$%]'
          sep='[\\/]{1,2}'
          root="(?:[a-z]:)?$sep(?:home|users)$sep"
          # A <name> that passes: a stand-in, a … placeholder, or a file such as C:\Users\notes.md.
          ok="(?:me|dev|devx|u|user|you|alice|bob|runner|runneradmin|public|default|…|$c*\.(?:md|txt|html?|json|png|jpe?g|pdf))"
          # <name> ends where no name character follows (a full stop may close a sentence), unless
          # more words run on to a separator or closing quote, as in a name with spaces.
          end="\.?(?!$c|(?:\s+$c+)+(?:$sep|[\"\x27\x60]))"
          pattern="(?i)$root(?!$ok$end)$c"
          status=0
          hits=$(git grep -P -n -I -e "$pattern" -- . ':(exclude)Cargo.lock' ':(exclude)ui/package-lock.json' \
            ':(exclude)*.woff2' ':(exclude)*.png' ':(exclude)*.ico' ':(exclude)*.icns') || status=$?
          # git grep exits 0 on a match, 1 on none, and higher on an error.
          if [ "$status" -eq 0 ]; then
            printf '%s\n' "$hits" | cut -d: -f1,2
            printf '%s\n' 'Use invented stand-ins (C:\Users\me, /home/me, \\nas\share, S:\Notes\My Vault); test data must never come from a real machine or vault.'
            exit 1
          elif [ "$status" -ne 1 ]; then
            exit "$status"
          fi

  core:
    name: Core (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p lectern-core --all-targets -- -D warnings
      - name: Test
        run: cargo test -p lectern-core
      - name: Render benchmark
        run: cargo run -p lectern-core --release --example render_bench
      # The tests above rewrite the ts-rs bindings; any change means the committed ones are stale.
      - name: TypeScript bindings are up to date
        run: |
          git status --porcelain -- ui/src/generated
          git diff --exit-code -- ui/src/generated
          test -z "$(git status --porcelain -- ui/src/generated)"

  ui:
    name: UI (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - name: Export the rendered fixtures
        run: cargo run -p lectern-core --example export_fixtures
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run e2e -- --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            ui/playwright-report/
            ui/test-results/
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        # Git Bash: PowerShell's npm.ps1 shim swallows the `--` before npm script arguments.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      # `tauri::generate_context!` embeds ui/dist, so lectern doesn't compile without it.
      - name: Build the UI
        working-directory: ui
        run: npm run build
      - name: Clippy
        run: cargo clippy -p lectern --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build lectern.exe
        working-directory: ui
        run: npm run tauri -- build --no-bundle

      # Opens the 3,000-line fixture plan and quits once it has painted, twice. The first launch
      # pays for the fresh runner's first WebView2 start-up and only has to paint; the second is
      # measured. The bound is generous for a shared runner; the real cold-start target is
      # measured on a dev machine. After each launch the step waits for its WebView2 processes to
      # exit: one still running holds up the next launch's WebView2 start-up until it is gone.
      - name: Smoke run
        shell: pwsh
        timeout-minutes: 5
        run: |
          $exe = (Resolve-Path target/release/lectern.exe).Path
          $doc = (Resolve-Path fixtures/vault/work/alpha/plans/2026-01-01-big-plan.md).Path
          # Lists the WebView2 processes a launch left running: those started after it began whose
          # parent chain leads to its Lectern process, or breaks at a parent that is gone.
          function Get-LeftoverWebView2([int] $lecternId, [DateTimeOffset] $began) {
            $byId = @{}
            Get-CimInstance Win32_Process -Property Name, ProcessId, ParentProcessId, CreationDate |
              ForEach-Object { $byId[[int] $_.ProcessId] = $_ }
            foreach ($proc in $byId.Values) {
              if ($proc.Name -ne 'msedgewebview2.exe') { continue }
              if ([DateTimeOffset] $proc.CreationDate -lt $began) { continue }
              $node = $proc
              for ($hops = 0; $hops -lt 16; $hops++) {
                $parentId = [int] $node.ParentProcessId
                if ($parentId -eq $lecternId) { $proc; break }
                $parent = $byId[$parentId]
                # The parent is gone, or its ID now names a process that started later.
                if (-not $parent -or $parent.CreationDate -gt $node.CreationDate) { $proc; break }
                if ($parent.Name -ne 'msedgewebview2.exe') { break }
                $node = $parent
              }
            }
          }
          # Waits up to 30 s for a launch's WebView2 processes to exit and logs how long it took.
          function Wait-WebView2Exit([string] $label, [int] $lecternId, [DateTimeOffset] $began) {
            $seen = [Collections.Generic.HashSet[int]]::new()
            $clock = [Diagnostics.Stopwatch]::StartNew()
            while ($true) {
              $left = @(Get-LeftoverWebView2 $lecternId $began)
              foreach ($proc in $left) { [void] $seen.Add([int] $proc.ProcessId) }
              if ($left.Count -eq 0 -or $clock.ElapsedMilliseconds -ge 30000) { break }
              Start-Sleep -Milliseconds 100
            }
            $clock.Stop()
            Write-Host ("$label launch: waited $($clock.ElapsedMilliseconds) ms for its WebView2" +
              " processes to exit ($($seen.Count) seen)")
            if ($left.Count -gt 0) {
              Write-Host "$label launch: $($left.Count) WebView2 processes still running after 30 s"
            }
          }
          # Launches Lectern once, prints its perf marks and returns its first-paint time in ms.
          function Measure-FirstPaint([string] $label) {
            $log = Join-Path $env:RUNNER_TEMP "perf-$label.jsonl"
            $began = [DateTimeOffset]::UtcNow
            $p = Start-Process -FilePath $exe -PassThru `
              -ArgumentList "`"$doc`"", '--perf-log', "`"$log`"", '--exit-after-paint'
            $exited = $false
            try {
              $exited = $p.WaitForExit(60000)
              if (-not $exited) { throw "$label launch: Lectern did not quit within 60 s" }
            } finally {
              # By ID, and only while it runs: once it has quit, its ID may name another process.
              if (-not $exited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            }
            $ended = [DateTimeOffset]::UtcNow
            Write-Host ("$label launch: start unixMs $($began.ToUnixTimeMilliseconds())," +
              " exit unixMs $($ended.ToUnixTimeMilliseconds())")
            Wait-WebView2Exit $label $p.Id $began
            if (-not (Test-Path $log)) { throw "$label launch: Lectern wrote no perf log" }
            $marks = @(Get-Content $log | ForEach-Object { $_ | ConvertFrom-Json })
            Write-Host "$label launch:"
            $marks | Format-Table event, sinceStartMs, extraMs -AutoSize | Out-String | Write-Host
            $paint = $marks | Where-Object event -eq 'first-paint' | Select-Object -First 1
            if (-not $paint) { throw "$label launch: the perf log has no first-paint mark" }
            [math]::Round($paint.sinceStartMs, 1)
          }
          $warm = Measure-FirstPaint 'warm-up'
          Write-Host "warm-up first-paint: $warm ms"
          if ($warm -ge 20000) { throw "the warm-up launch took $warm ms to paint; the bound is 20000 ms" }
          $ms = Measure-FirstPaint 'measured'
          Write-Host "first-paint: $ms ms"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 `
            -Value "Smoke run first-paint: **$ms ms** (bound 3000 ms; warm-up launch $warm ms)"
          if ($ms -ge 3000) { throw "first paint took $ms ms; the bound is 3000 ms" }

      - name: Upload lectern.exe
        uses: actions/upload-artifact@v7
        with:
          name: lectern-windows-x64
          path: target/release/lectern.exe
          if-no-files-found: error
