# TypeScript bindings for the IPC types (ts-rs). Every type with `#[ts(export)]` is written to
# `ui/src/generated/<Type>.ts` by the export tests ts-rs generates, so a plain
# `cargo test -p lectern-core` refreshes them. `relative = true` resolves the directory against
# the repo root (the folder holding `.cargo/`). Cargo reads this file only when run from inside
# the repo; `crates/lectern-core/tests/ipc_export.rs` fails if these are not set.
[env]
TS_RS_EXPORT_DIR = { value = "ui/src/generated", relative = true }
# i64 and u64 (`mtimeMs`, `openedMs`) cross IPC as JSON numbers, not `bigint`.
TS_RS_LARGE_INT = "number"
