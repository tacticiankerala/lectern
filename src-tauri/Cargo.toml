[package]
name = "lectern"
description = "Lectern, a fast native Markdown reader for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
dirs = "7"
lectern-core = { path = "../crates/lectern-core" }
log = { version = "0.4.34", features = ["std"] }
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
# `generate_context!` embeds the `plugins` config as `serde_json` values.
serde_json = "1.0.151"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-single-instance = "2.5.2"
# native-tls (SChannel on Windows) instead of rustls, so no ring or aws-lc-rs; no `zip`, which only
# v1-compatible updater archives and other platforms' bundles need.
tauri-plugin-updater = { version = "2.13.1", default-features = false, features = [
  "native-tls",
  "system-proxy",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
