[package]
name = "lectern"
description = "Lectern, a fast native Markdown reader for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
dirs = "7"
lectern-core = { path = "../crates/lectern-core" }
log = { version = "0.4.34", features = ["std"] }
percent-encoding = "2.3.2"
# The updater's own HTTP client, so `updater.rs` can name the `ClientBuilder` it configures (and its
# tests get a real timeout error): no new crates. Keep it on the updater's version.
reqwest = { version = "0.13", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
# `generate_context!` embeds the `plugins` config as `serde_json` values.
serde_json = "1.0.151"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-single-instance = "2.5.2"
# native-tls (SChannel on Windows) instead of rustls, so no ring or aws-lc-rs; no `zip`, which only
# v1-compatible updater archives and other platforms' bundles need.
tauri-plugin-updater = { version = "2.13.1", default-features = false, features = [
  "native-tls",
  "system-proxy",
] }

[target.'cfg(windows)'.dependencies]
# WebView2's own API, for the keys pressed inside a frame (`accelerators.rs`): the version Tauri's
# webview uses, so it adds no crate.
webview2-com = "0.39.1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Security",
  # The agent pipe (`pipe.rs`): its DACL, the user's SID, overlapped reads and writes.
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
