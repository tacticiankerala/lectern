<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Survey index</title>
</head>
<body>
<h1>Survey index</h1>
<p>An invented page whose button sends its own frame to the other page.</p>
<button id="next" type="button">Next page</button>
<script>
  document.getElementById("next").addEventListener("click", function () {
    location.href = "other.html";
  });
</script>
</body>
</html>
