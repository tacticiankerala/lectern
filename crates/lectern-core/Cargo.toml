[package]
name = "lectern-core"
description = "Rendering, library and settings logic for Lectern, with no Tauri dependency"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
ammonia = "4.2.0"
comrak = { version = "0.55.0", default-features = false }
jwalk = "0.9.0"
notify = "8.2.0"
percent-encoding = "2.3.2"
rayon = "1.12.0"
regex = "1.13.1"
saphyr = { version = "0.1.0", default-features = false }
saphyr-parser = "0.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "html", "dump-load", "regex-fancy"] }
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
unicode-segmentation = "1.13.3"

[dev-dependencies]
insta = { version = "1.48.0", features = ["glob"] }
tempfile = "3.27.0"
