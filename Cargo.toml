[workspace]
resolver = "2"
members = ["crates/lectern-core", "src-tauri"]
default-members = ["crates/lectern-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tacticiankerala/lectern"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
